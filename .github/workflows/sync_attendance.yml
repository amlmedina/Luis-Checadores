name: Sincronizar Asistencia a Google Sheets

on:
  schedule:
    - cron: '0 * * * *'        # Se ejecuta automáticamente al inicio de cada hora
  workflow_dispatch:          # Permite ejecución manual desde GitHub

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de sincronización
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python sync_to_sheets.py
          python export_web_data.py

      - name: Actualizar datos de GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || (git commit -m "chore: actualizar datos web" && git push)
